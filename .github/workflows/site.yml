name: Website

on:
  push:
    branches: [main]
    paths:
      - apps/warpgatesh-site/**
      - docs/**
      - .github/workflows/site.yml
      - flake.nix
      - flake.lock
      - nix/**
  pull_request:
    paths:
      - apps/warpgatesh-site/**
      - docs/**
      - .github/workflows/site.yml
      - flake.nix
      - flake.lock
      - nix/**

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - run: nix run .#build-site
      - uses: actions/upload-artifact@v4
        with:
          name: warpgatesh-site
          path: apps/warpgatesh-site/dist
          if-no-files-found: error
