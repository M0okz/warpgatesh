name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt

      - name: Select minimum supported Rust
        run: rustup default 1.85.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  companion:
    name: macOS companion
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/warpgatesh-companion

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/warpgatesh-companion/package-lock.json

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt

      - name: Select minimum supported Rust
        run: rustup default 1.85.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test native commands
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run native Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build unified macOS application bundle
        run: npm run tauri build -- --bundles app --ci --no-sign

      - name: Verify bundled CLI and agent
        run: npm run verify:bundle
