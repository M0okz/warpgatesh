name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31

      - name: Check Rust in the reference environment
        run: nix develop --command bash nix/tasks.sh check-rust

      - name: Build and test the Nix package
        run: nix flake check --print-build-logs

  companion:
    name: macOS companion
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31

      - name: Select Xcode for the SwiftUI companion
        run: bash .github/scripts/select-xcode.sh

      - name: Check macOS companion in the reference environment
        run: nix develop --command bash nix/tasks.sh check-companion

      - name: Build and verify universal application and DMG
        run: nix run .#build-macos

  homebrew:
    name: Homebrew Formula
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Formula style
        run: brew style Formula/warpgatesh.rb
