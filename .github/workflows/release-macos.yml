name: Release macOS

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Signed universal DMG
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/warpgatesh-companion
        shell: nix develop --command bash -e {0}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31

      - name: Select Xcode for the SwiftUI companion
        run: bash ../../.github/scripts/select-xcode.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run verify:release-version -- "${RELEASE_TAG}"

      - name: Require Apple release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "${APPLE_CERTIFICATE}"
          test -n "${APPLE_CERTIFICATE_PASSWORD}"
          test -n "${KEYCHAIN_PASSWORD}"
          test -n "${APPLE_ID}"
          test -n "${APPLE_PASSWORD}"
          test -n "${APPLE_TEAM_ID}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/warpgatesh-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/warpgatesh-signing.keychain-db"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          identity=$(security find-identity -v -p codesigning "${keychain_path}" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          test -n "${identity}"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "${identity}" >> "${GITHUB_ENV}"

      - name: Build, sign and notarize universal DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run bundle:macos:universal

      - name: Finalize stapled distribution artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          stapler_check() {
            local attempt code
            for attempt in 1 2 3 4 5 6; do
              if xcrun stapler "$@"; then return 0; else code=$?; fi
              if [ "${code}" -ne 68 ] || [ "${attempt}" -eq 6 ]; then return "${code}"; fi
              echo "Apple ticket service unavailable; retry ${attempt}/6 in 5 seconds."
              sleep 5
            done
          }
          bundle="src-tauri/target/universal-apple-darwin/release/bundle/macos/WarpgateSH.app"
          dmg="src-tauri/target/universal-apple-darwin/release/bundle/dmg/WarpgateSH_${RELEASE_TAG#v}_universal.dmg"
          updater="${bundle}.tar.gz"
          stapler_check staple "${bundle}"
          stapler_check validate "${bundle}"
          image_root="$(mktemp -d "${RUNNER_TEMP}/warpgatesh-image.XXXXXX")"
          trap 'rm -rf "${image_root}"' EXIT
          ditto "${bundle}" "${image_root}/WarpgateSH.app"
          stapler_check validate "${image_root}/WarpgateSH.app"
          ln -s /Applications "${image_root}/Applications"
          hdiutil create -volname WarpgateSH -srcfolder "${image_root}" -format UDZO -ov "${dmg}"
          codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --timestamp "${dmg}"
          tar -czf "${updater}" -C "$(dirname "${bundle}")" WarpgateSH.app
          npm run tauri -- signer sign "${updater}"
          archive_root="${image_root}/updater-check"
          mkdir "${archive_root}"
          tar -xzf "${updater}" -C "${archive_root}"
          codesign --verify --deep --strict "${archive_root}/WarpgateSH.app"
          stapler_check validate "${archive_root}/WarpgateSH.app"

      - name: Notarize and staple disk image
        run: |
          stapler_check() {
            local attempt code
            for attempt in 1 2 3 4 5 6; do
              if xcrun stapler "$@"; then return 0; else code=$?; fi
              if [ "${code}" -ne 68 ] || [ "${attempt}" -eq 6 ]; then return "${code}"; fi
              echo "Apple ticket service unavailable; retry ${attempt}/6 in 5 seconds."
              sleep 5
            done
          }
          dmg="src-tauri/target/universal-apple-darwin/release/bundle/dmg/WarpgateSH_${RELEASE_TAG#v}_universal.dmg"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          stapler_check staple "${dmg}"

      - name: Verify Apple distribution checks
        run: |
          stapler_check() {
            local attempt code
            for attempt in 1 2 3 4 5 6; do
              if xcrun stapler "$@"; then return 0; else code=$?; fi
              if [ "${code}" -ne 68 ] || [ "${attempt}" -eq 6 ]; then return "${code}"; fi
              echo "Apple ticket service unavailable; retry ${attempt}/6 in 5 seconds."
              sleep 5
            done
          }
          bundle="src-tauri/target/universal-apple-darwin/release/bundle/macos/WarpgateSH.app"
          dmg="src-tauri/target/universal-apple-darwin/release/bundle/dmg/WarpgateSH_${RELEASE_TAG#v}_universal.dmg"
          codesign --verify --deep --strict --verbose=2 "${bundle}"
          spctl --assess --type execute --verbose=2 "${bundle}"
          stapler_check validate "${bundle}"
          hdiutil verify "${dmg}"
          stapler_check validate "${dmg}"
          dmg_directory="$(dirname "${dmg}")"
          dmg_name="$(basename "${dmg}")"
          (cd "${dmg_directory}" && shasum -a 256 "${dmg_name}" > "${dmg_name}.sha256")

      - name: Generate signed updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          updater="src-tauri/target/universal-apple-darwin/release/bundle/macos/WarpgateSH.app.tar.gz"
          signature="${updater}.sig"
          notes="${RUNNER_TEMP}/release-notes.md"
          manifest="${RUNNER_TEMP}/latest.json"
          test -s "${updater}"
          test -s "${signature}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" --jq .body > "${notes}"
          node scripts/generate-updater-manifest.mjs \
            "${RELEASE_TAG}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/WarpgateSH.app.tar.gz" \
            "${signature}" "${notes}" "${manifest}"
          jq -e \
            --arg version "${RELEASE_TAG#v}" \
            '.version == $version and .platforms["darwin-aarch64"].signature != "" and .platforms["darwin-x86_64"].url != ""' \
            "${manifest}" >/dev/null

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="src-tauri/target/universal-apple-darwin/release/bundle/dmg/WarpgateSH_${RELEASE_TAG#v}_universal.dmg"
          updater="src-tauri/target/universal-apple-darwin/release/bundle/macos/WarpgateSH.app.tar.gz"
          gh release create "${RELEASE_TAG}" \
            "${dmg}" "${dmg}.sha256" \
            "${updater}#WarpgateSH.app.tar.gz" "${updater}.sig#WarpgateSH.app.tar.gz.sig" \
            "${RUNNER_TEMP}/latest.json#latest.json" \
            --verify-tag \
            --draft \
            --title "WarpgateSH ${RELEASE_TAG#v}" \
            --generate-notes

      - name: Preserve distribution outputs after a failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-release-recovery
          retention-days: 1
          if-no-files-found: ignore
          path: |
            apps/warpgatesh-companion/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/warpgatesh-companion/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
