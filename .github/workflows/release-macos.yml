name: Release macOS
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to rebuild
        required: true
        type: string
permissions:
  contents: write
jobs:
  macos:
    name: Signed universal DMG
    runs-on: macos-latest
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771
      - name: Select Xcode
        run: bash .github/scripts/select-xcode.sh
      - name: Verify release version
        run: |
          python3 -c 'import os,tomllib; assert tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"] == os.environ["RELEASE_TAG"].removeprefix("v")'
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/warpgatesh-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/warpgatesh-signing.keychain-db"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          identity=$(security find-identity -v -p codesigning "${keychain_path}" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          test -n "${identity}"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "${identity}" >> "${GITHUB_ENV}"

      - name: Build signed and notarized distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_NOTES_FILE="${RUNNER_TEMP}/notes.md"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > "$RELEASE_NOTES_FILE"
          nix run .#release-macos
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory=apps/warpgatesh-macos/.build/distribution
          gh release create "$RELEASE_TAG" "$directory"/*.dmg "$directory"/*.sha256 "$directory"/*.tar.gz "$directory"/*.sig "$directory/latest.json" --verify-tag --draft --title "WarpgateSH ${RELEASE_TAG#v}" --generate-notes
      - name: Preserve failed distribution outputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-release-recovery
          retention-days: 1
          path: apps/warpgatesh-macos/.build/distribution
