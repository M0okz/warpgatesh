[workspace]
members = [
    "crates/warpgatesh-agent",
    "crates/warpgatesh-cli",
    "crates/warpgatesh-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/M0okz/warpgatesh"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
