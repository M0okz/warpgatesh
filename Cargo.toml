[workspace]
members = [
    "crates/warpgatesh-agent",
    "crates/warpgatesh-cli",
    "crates/warpgatesh-core",
    "crates/warpgatesh-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/M0okz/warpgatesh"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
glob = "0.3.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
