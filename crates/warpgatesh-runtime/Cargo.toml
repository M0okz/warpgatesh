[package]
name = "warpgatesh-runtime"
description = "Warpgate API and operating-system integration for WarpgateSH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono.workspace = true
glob.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
warpgatesh-core = { path = "../warpgatesh-core" }
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["crypto-rust", "sync-secret-service", "vendored"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
