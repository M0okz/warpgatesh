[workspace]

[package]
name = "warpgatesh-companion"
description = "Optional desktop companion for WarpgateSH"
version = "0.1.6"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/M0okz/warpgatesh"

[lib]
name = "warpgatesh_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
warpgatesh-core = { path = "../../../crates/warpgatesh-core" }
warpgatesh-runtime = { path = "../../../crates/warpgatesh-runtime" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
